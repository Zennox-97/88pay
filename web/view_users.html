<!DOCTYPE html>
<html>
<head>
    <img src="indexfcash.png" alt="logo broken"/>
    <title>88 Pay - Users Dashboard</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            background: #111; 
            color: #eee;
            padding: 20px;
            text-align:center;
        }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #444; padding: 12px; text-align: left; }
        th { background: #222; }
        a { color: #0f0; }
        .small { font-size: 0.9em; color: #aaa; }
        button.delete { background: #c33; color: white; border: none; padding: 4px 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>88 Pay - Admin Users Dashboard</h1>
    <p><a href="/user">← Back to Admin Panel</a></p>

    <h2>Registered Users</h2>
    <table>
        <tr>
            <th>User ID</th>
            <th>Username</th>
            <th>Date Enabled</th>
            <th>Actions</th>
        </tr>
        {{range $id, $user := .Users}}
        <tr>
            <td>{{$id}}</td>
            <td>{{$user.Username}}</td>
            <td>{{$user.DateEnabled}}</td>
            <td>
                <a href="/viewdonos">View Donations</a> |
                <a href="/user?username={{$user.Username}}">Edit</a> 
            </td>
        </tr>
        {{end}}
    </table>

    <p class="small">88 Pay is self-hosted. — only admin user needed.</p>
</body>
</html>
