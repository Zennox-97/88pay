<!-- progressbar.html | HTML for the OBS donation bar -->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>88pay Donation Bar</title>
<style>
  body {
    background: #12151C;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    width: 100%;
    box-sizing: border-box;
  }
  .bar-container {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
  }
  .progress {
    width: 100%;
    height: 28px;
    background: #262b3b;
    border-radius: 4px;
    overflow: hidden;
    margin: 12px 0;
  }
  .progress-bar {
    height: 100%;
    background: #4CAF50;
    transition: width 0.6s ease;
    width: 0%;
  }
  .labels {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
  }
  .message {
    font-size: 17px;
    margin-bottom: 8px;
    min-height: 24px;
  }
</style>
</head>
<body>
  <div class="bar-container">
    <div class="message" id="message">{{.Message}}</div>

    <div class="labels">
      <div><span id="sent">{{.Sent}}</span> / <span id="needed">{{.Needed}}</span></div>
      <div id="percent">0%</div>
    </div>

    <div class="progress">
      <div class="progress-bar" id="bar"></div>
    </div>
  </div>

<script>
const POLL_INTERVAL = 5000;

function getValueFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get('value') || '';
}

function updateFromData(data) {
  document.getElementById('sent').textContent = data.sent ?? '0';
  document.getElementById('needed').textContent = data.needed ?? '0';
  document.getElementById('message').textContent = data.message || '';

  const percent = (data.needed > 0)
    ? Math.min(Math.round((data.sent / data.needed) * 100), 100)
    : 0;

  document.getElementById('percent').textContent = percent + '%';
  document.getElementById('bar').style.width = percent + '%';
}

async function updateProgress() {
  const value = getValueFromURL();
  let url = '/api/progress';
  if (value) url += '?value=' + encodeURIComponent(value);

  try {
    const res = await fetch(url);
    if (!res.ok) return;

    const data = await res.json();
    updateFromData(data);
  } catch (e) {
    console.warn('[ProgressBar] Poll failed:', e);
  }
}

// Initial load uses whatever data the server already rendered in the HTML
// Then we start polling for live updates
setTimeout(() => {
  // Try to read initial values that were rendered server-side
  const initialData = {
    sent: parseFloat(document.getElementById('sent').textContent) || 0,
    needed: parseFloat(document.getElementById('needed').textContent) || 50,
    message: document.getElementById('message').textContent || ''
  };
  updateFromData(initialData);

  // Start live polling
  setInterval(updateProgress, POLL_INTERVAL);
}, 300);
</script>

</body>
</html>
